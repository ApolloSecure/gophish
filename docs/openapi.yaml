openapi: 3.0.3
info:
  title: Gophish API
  version: "1.0"
  description: Apollo Gophish fork API additions for tenant-scoped campaigns.
security:
  - bearerApiKey: []
paths:
  /api/tenants/{tenantId}:
    delete:
      summary: Purge all phishing data owned by a tenant
      description: Idempotently deletes tenant-owned campaigns, campaign children, groups, memberships, targets, email requests, and the tenant ownership row in one transaction. Legacy null-owned data and shared configuration are retained.
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Exact non-empty tenant identifier. This is never inferred from a name.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      responses:
        "200":
          description: Purge committed. Unknown and previously purged tenants return zero counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPurgeResult"
        "400":
          $ref: "#/components/responses/InvalidTenantId"
        "401":
          description: Missing or invalid API key.
        "500":
          description: Purge failed and the transaction was rolled back.
  /api/campaigns/:
    get:
      summary: List campaigns
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: page
          in: query
          description: One-based page number for tenant-filtered requests.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Page size for tenant-filtered requests.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: include_results
          in: query
          description: Include results, timeline, and summary. Requires tenant_id.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Campaigns owned by the authenticated user, optionally filtered by tenant_id. Tenant-filtered results are ordered by id descending.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/InvalidTenantId"
    post:
      summary: Create a campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreate"
      responses:
        "201":
          description: Campaign created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/InvalidTenantId"
  /api/campaigns/{id}:
    get:
      summary: Get a campaign
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Campaign details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "400":
          $ref: "#/components/responses/InvalidTenantId"
        "404":
          description: Campaign not found for the authenticated user and supplied tenant.
  /api/campaigns/{id}/results:
    get:
      summary: Get campaign results
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Campaign results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResults"
        "400":
          $ref: "#/components/responses/InvalidTenantId"
        "404":
          description: Campaign not found for the authenticated user and supplied tenant.
components:
  securitySchemes:
    bearerApiKey:
      type: http
      scheme: bearer
      description: Existing Gophish API key.
  parameters:
    CampaignId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TenantId:
      name: tenant_id
      in: query
      required: false
      description: Exact tenant identifier beneath the authenticated Gophish user.
      schema:
        type: string
        minLength: 1
        maxLength: 255
  responses:
    InvalidTenantId:
      description: Invalid tenant_id or query parameter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    TenantPurgeResult:
      type: object
      required: [tenant_id, deleted]
      properties:
        tenant_id:
          type: string
        deleted:
          $ref: "#/components/schemas/TenantDeletionCounts"
    TenantDeletionCounts:
      type: object
      required: [campaigns, results, events, mail_logs, groups, group_targets, targets, email_requests, tenant]
      properties:
        campaigns: {type: integer, format: int64}
        results: {type: integer, format: int64}
        events: {type: integer, format: int64}
        mail_logs: {type: integer, format: int64}
        groups: {type: integer, format: int64}
        group_targets: {type: integer, format: int64}
        targets: {type: integer, format: int64}
        email_requests: {type: integer, format: int64}
        tenant: {type: integer, format: int64}
    GroupCreate:
      type: object
      required: [name, targets]
      properties:
        tenant_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Optional ownership identifier inherited by every target. Omission persists as null.
        name:
          type: string
        targets:
          type: array
          items:
            $ref: "#/components/schemas/Target"
    Target:
      type: object
      required: [email]
      properties:
        tenant_id:
          type: string
          nullable: true
          readOnly: true
        email:
          type: string
          format: email
        first_name: {type: string}
        last_name: {type: string}
        position: {type: string}
        custom_fields:
          type: object
          additionalProperties:
            type: string
    EmailRequestOwnership:
      type: object
      properties:
        tenant_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Optional ownership identifier for persisted test-email requests.
    CampaignCreate:
      type: object
      required: [name, groups, template, page, smtp, url]
      properties:
        tenant_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
          description: Immutable after campaign creation. Omission persists as null.
        name:
          type: string
        groups:
          type: array
          items:
            type: object
        template:
          type: object
        page:
          type: object
        smtp:
          type: object
        url:
          type: string
          format: uri
        launch_date:
          type: string
          format: date-time
          nullable: true
        send_by_date:
          type: string
          format: date-time
          nullable: true
    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignCreate"
        - type: object
          required: [id, tenant_id, status]
          properties:
            id:
              type: integer
              format: int64
            tenant_id:
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
            status:
              type: string
            created_date:
              type: string
              format: date-time
            completed_date:
              type: string
              format: date-time
              nullable: true
            results:
              type: array
              items:
                type: object
            timeline:
              type: array
              items:
                type: object
            summary:
              $ref: "#/components/schemas/CampaignSummary"
    CampaignResults:
      type: object
      required: [id, tenant_id, name, status]
      properties:
        id:
          type: integer
          format: int64
        tenant_id:
          type: string
          nullable: true
          minLength: 1
          maxLength: 255
        name:
          type: string
        status:
          type: string
        results:
          type: array
          items:
            type: object
        timeline:
          type: array
          items:
            type: object
        summary:
          $ref: "#/components/schemas/CampaignSummary"
    CampaignSummary:
      type: object
      required: [total, sent, opened, clicked, submitted_data, email_reported, error]
      properties:
        total: {type: integer, format: int64}
        sent: {type: integer, format: int64}
        opened: {type: integer, format: int64}
        clicked: {type: integer, format: int64}
        submitted_data: {type: integer, format: int64}
        email_reported: {type: integer, format: int64}
        error: {type: integer, format: int64}
    Error:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [false]
        message:
          type: string
