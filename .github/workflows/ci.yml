name: CI
on:
  - pull_request
  - push
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go 1.26
      uses: actions/setup-go@v6
      with:
        go-version: "1.26.3"
        check-latest: true
        cache: true
        cache-dependency-path: go.sum
      id: go

    - name: Download dependencies
      run: go mod download

    - name: Build
      run: go build -v .
    
    - name: Format
      run: diff -u <(echo -n) <(gofmt -d .)
    
    - name: Test (SQLite)
      run: go test ./...

  postgres:
    name: Postgres Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@v6

    - name: Set up Go 1.26
      uses: actions/setup-go@v6
      with:
        go-version: "1.26.3"
        check-latest: true
        cache: true
        cache-dependency-path: go.sum

    - name: Download dependencies
      run: go mod download

    - name: Test (Postgres)
      env:
        GOPHISH_TEST_DB: postgres
        GOPHISH_TEST_POSTGRES_ADMIN_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres sslmode=disable
      run: go test -p 1 ./...
